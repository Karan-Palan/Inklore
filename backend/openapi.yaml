openapi: 3.0.3
x-10x-generated-openapi: true
info:
  title: "Inkflow Backend"
  version: 1.0.0
servers:
  - url: https://{project_ref}.api.10x.app
    variables:
      project_ref:
        default: project
paths:
  "/api/v1/link-import":
    post:
      operationId: "create_link_import"
      summary: "Import a public article or document link"
      description: "Extracts readable article text server-side, or validates a direct PDF/EPUB/DOCX/RTF file for device-local import. Private and non-public network destinations are rejected."
      x-10x-route-name: "create_link_import"
      x-10x-auth-policy: "none"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri, minLength: 8, maxLength: 2048}
      responses:
        "200":
          description: Reader-ready article or validated direct file
          content:
            application/json:
              schema:
                type: object
                required: [kind, title, source_name, source_url]
                properties:
                  kind: {type: string, enum: [article, file]}
                  title: {type: string}
                  author: {type: string, nullable: true}
                  text: {type: string, nullable: true}
                  source_name: {type: string}
                  source_url: {type: string, format: uri}
                  content_type: {type: string, nullable: true}
        "403": {description: Private or blocked page}
        "413": {description: Page exceeds safe import size}
        "422": {description: Unsupported or unsafe link}
      tags: [api]
  "/api/v1/voices":
    get:
      operationId: "get_voices"
      summary: "List available ElevenLabs narration voices"
      description: "Returns display-safe provider metadata and preview URLs. Provider credentials remain server-side."
      x-10x-route-name: "get_voices"
      x-10x-auth-policy: "none"
      responses:
        "200":
          description: Voice catalogue
          content:
            application/json:
              schema:
                type: object
                required: [provider, voices]
                properties:
                  provider: {type: string, enum: [elevenlabs]}
                  voices:
                    type: array
                    items:
                      type: object
                      required: [voice_id, name, labels]
                      properties:
                        voice_id: {type: string}
                        name: {type: string}
                        category: {type: string, nullable: true}
                        description: {type: string, nullable: true}
                        preview_url: {type: string, format: uri, nullable: true}
                        labels:
                          type: object
                          additionalProperties: {type: string}
        "503":
          description: ElevenLabs voice catalogue unavailable
      tags: [api]
  "/api/v1/summaries":
    post:
      operationId: "create_summary"
      summary: "Generate a grounded Markdown reading summary"
      x-10x-route-name: "create_summary"
      x-10x-auth-policy: "none"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_title, section_title, text]
              properties:
                book_title: {type: string, maxLength: 300}
                author: {type: string, maxLength: 300}
                section_title: {type: string, maxLength: 300}
                text: {type: string, minLength: 80, maxLength: 60000}
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                type: object
                required: [markdown, model, reasoning_effort]
                properties:
                  markdown: {type: string}
                  model: {type: string}
                  reasoning_effort: {type: string}
      tags: [api]
  "/api/v1/narration":
    post:
      operationId: "create_narration"
      summary: "Generate ElevenLabs narration with character timing"
      x-10x-route-name: "create_narration"
      x-10x-auth-policy: "none"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 5000}
                voice_id: {type: string, nullable: true, maxLength: 200}
      responses:
        "200":
          description: Base64 audio and alignment
          content:
            application/json:
              schema:
                type: object
                required: [audio_base64, voice_id, output_format]
                properties:
                  audio_base64: {type: string}
                  alignment: {type: object, nullable: true}
                  normalized_alignment: {type: object, nullable: true}
                  model: {type: string, nullable: true}
                  voice_id: {type: string}
                  output_format: {type: string}
      tags: [api]
  "/api/v1/daily-digest":
    post:
      operationId: "daily_digest"
      summary: "POST /api/v1/daily-digest"
      x-10x-route-name: "daily_digest"
      x-10x-auth-policy: "required"
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      tags:
        - api
  "/api/v1/digest/preferences":
    post:
      operationId: "digest_preferences"
      summary: "POST /api/v1/digest/preferences"
      x-10x-route-name: "digest_preferences"
      x-10x-auth-policy: "required"
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      tags:
        - api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
